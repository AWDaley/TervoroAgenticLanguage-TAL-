name: TAL benchmark domain admission
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Authored offline fixtures only; no hosted agent, user simulator, or judge.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''

jobs:
  domain-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the existing frozen TAL development and API environment
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --all-extras --python 3.12
      - name: Lint the domain admission implementation and fixtures
        run: .venv/bin/ruff check src/tal/domain_admission.py tests/test_domain_admission.py
      - name: Type check the strict admission API
        run: .venv/bin/mypy --strict src/tal/domain_admission.py
      - name: Require all domain admission contract tests
        run: |
          .venv/bin/python -m pytest tests/test_domain_admission.py --junitxml=domain-admission.xml
          .venv/bin/python -c "import xml.etree.ElementTree as E; s=E.parse('domain-admission.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=20; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
      - name: Require the complete TAL regression suite
        run: |
          .venv/bin/python -m pytest tests --junitxml=tal-regressions.xml
          .venv/bin/python -c "import xml.etree.ElementTree as E; s=E.parse('tal-regressions.xml').getroot().findall('testsuite'); assert s and sum(int(x.get('tests',0)) for x in s)>=115; assert all(int(x.get(k,0))==0 for x in s for k in ('skipped','errors','failures'))"
