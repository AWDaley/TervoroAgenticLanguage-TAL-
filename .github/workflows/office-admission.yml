name: TAL office admission contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Lint office domain
        run: ruff check src/tal/office.py tests/test_office_domain.py
      - name: Type check office domain
        run: mypy --strict src/tal/office.py
      - name: Run office conformance and legacy harness tests
        run: pytest -q tests/test_office_domain.py tests/test_harness.py
